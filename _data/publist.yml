# 2024

- title: "Moral exemplars promote positive attitudes, beliefs, intentions, and behaviors toward outgroups during the COVID-19 pandemic: The explanatory role of self-transcendent emotions"
  image: pub_moral_exemplars.png
  description: Can stories of moral courage change how we feel about outgroups? We show that exposure to moral exemplars promotes positive attitudes and prosocial behaviours toward outgroups during the COVID-19 pandemic, with self-transcendent emotions explaining why.
